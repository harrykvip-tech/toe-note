name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare www
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            cp index.html www/index.html 2>/dev/null || cp toe-note-pro-voice.html www/index.html
          fi
          ls -la www
      - name: Add Android platform
        run: npx cap add android
      - name: Make icon.png from svg
        run: node -e "require('sharp')('resources/icon.svg',{density:600}).resize(1024,1024).png().toFile('resources/icon.png').then(()=>console.log('icon ok'))"
        continue-on-error: true
      - name: Generate icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#fc6238' --iconBackgroundColorDark '#fc6238'
        continue-on-error: true
      - name: Add permissions (microphone, notifications)
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' $F
          grep -n "uses-permission" $F
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: toe-note-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
