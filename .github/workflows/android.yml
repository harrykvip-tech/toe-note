name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare www
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            cp index.html www/index.html 2>/dev/null || cp toe-note-pro-voice.html www/index.html
          fi
          python3 - <<'EOF'
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          hook = """<script>
          (function () {
            var orig = window.applyAppIcon;
            window.applyAppIcon = function (n) {
              if (orig) orig.apply(this, arguments);
              try {
                var C = window.Capacitor;
                if (!C) return;
                var P = (C.Plugins && C.Plugins.ToeIcon) || (C.registerPlugin && C.registerPlugin('ToeIcon'));
                if (P) P.set({ index: parseInt(n, 10) || 0 });
              } catch (e) {}
            };
          })();
          </script>
          """
          if 'ToeIcon' not in s:
              i = s.rfind('</body>')
              s = s[:i] + hook + s[i:] if i != -1 else s + hook
          open(p, 'w', encoding='utf-8').write(s)
          print('hook ok')
          EOF
          ls -la www
      - name: Add Android platform
        run: npx cap add android
      - name: Make all app icons
        run: |
          node <<'EOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const syms = {};
          for (const m of html.matchAll(/<symbol id="toe-logo-(\d+)" viewBox="([^"]+)">([\s\S]*?)<\/symbol>/g)) {
            syms[m[1]] = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + m[2] + '">' + m[3] + '</svg>');
          }
          const fallback = fs.readFileSync('resources/icon.svg');
          const get = (i) => syms[i] || syms[0] || fallback;
          const res = 'android/app/src/main/res';
          const legacy = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          const fg = { mdpi: 108, hdpi: 162, xhdpi: 216, xxhdpi: 324, xxxhdpi: 432 };
          (async () => {
            for (const d of Object.keys(legacy)) {
              const dir = res + '/mipmap-' + d;
              fs.mkdirSync(dir, { recursive: true });
              for (const f of fs.readdirSync(dir)) {
                if (f.startsWith('ic_launcher')) fs.unlinkSync(dir + '/' + f);
              }
              const s = legacy[d];
              const sq = await sharp(get(0), { density: 600 }).resize(s, s).png().toBuffer();
              fs.writeFileSync(dir + '/ic_launcher.png', sq);
              const mask = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="' + s + '" height="' + s + '"><circle cx="' + (s / 2) + '" cy="' + (s / 2) + '" r="' + (s / 2) + '"/></svg>');
              const round = await sharp(sq).composite([{ input: mask, blend: 'dest-in' }]).png().toBuffer();
              fs.writeFileSync(dir + '/ic_launcher_round.png', round);
              const big = fg[d];
              const inner = Math.round(big * 0.62);
              const ic = await sharp(get(0), { density: 600 }).resize(inner, inner).png().toBuffer();
              const f = await sharp({ create: { width: big, height: big, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } }).composite([{ input: ic, gravity: 'center' }]).png().toBuffer();
              fs.writeFileSync(dir + '/ic_launcher_foreground.png', f);
              for (let i = 0; i < 7; i++) {
                const t = await sharp(get(i), { density: 600 }).resize(s, s).png().toBuffer();
                fs.writeFileSync(dir + '/ic_toe_' + i + '.png', t);
              }
            }
            fs.mkdirSync(res + '/values', { recursive: true });
            fs.writeFileSync(res + '/values/ic_launcher_background.xml', '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#fc6238</color>\n</resources>\n');
            console.log('icons ok: ' + Object.keys(syms).length + ' symbols found');
          })();
          EOF
      - name: Add icon switcher (native code and manifest)
        run: |
          D=android/app/src/main/java/com/toe/note
          mkdir -p $D
          cat > $D/MainActivity.java <<'EOF'
          package com.toe.note;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(IconPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          cat > $D/IconPlugin.java <<'EOF'
          package com.toe.note;

          import android.content.ComponentName;
          import android.content.pm.PackageManager;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ToeIcon")
          public class IconPlugin extends Plugin {
              @PluginMethod
              public void set(PluginCall call) {
                  int n = call.getInt("index", 0);
                  PackageManager pm = getContext().getPackageManager();
                  String pkg = getContext().getPackageName();
                  pm.setComponentEnabledSetting(new ComponentName(pkg, "com.toe.note.Icon" + n),
                      PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP);
                  for (int i = 0; i < 7; i++) {
                      if (i == n) continue;
                      pm.setComponentEnabledSetting(new ComponentName(pkg, "com.toe.note.Icon" + i),
                          PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP);
                  }
                  call.resolve();
              }
          }
          EOF
          python3 - <<'EOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          launcher = re.compile(r'<intent-filter>\s*<action android:name="android.intent.action.MAIN"\s*/>\s*<category android:name="android.intent.category.LAUNCHER"\s*/>\s*</intent-filter>')
          assert launcher.search(s), 'launcher filter not found'
          s = launcher.sub('', s, count=1)
          alias = ''
          for i in range(7):
              alias += '''
              <activity-alias
                  android:name=".Icon%d"
                  android:targetActivity=".MainActivity"
                  android:enabled="%s"
                  android:exported="true"
                  android:icon="@mipmap/ic_toe_%d"
                  android:label="@string/app_name">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity-alias>''' % (i, 'true' if i == 0 else 'false', i)
          s = s.replace('</application>', alias + '\n    </application>')
          s = s.replace('<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('manifest ok')
          EOF
          cat android/app/src/main/AndroidManifest.xml
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: toe-note-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
